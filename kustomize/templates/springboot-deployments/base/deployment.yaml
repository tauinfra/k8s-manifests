apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: springboot-deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: springboot-deployment
    spec:
      containers:
        - name: springboot-deployment
          image: registry.commany.com/springboot-deployment:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              exec java ${JVM_OPTS} \
              -Dspring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR} \
              -Dspring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR} \
              -Dspring.cloud.nacos.discovery.namespace=${NACOS_NAMESPACE} \
              -Dspring.cloud.nacos.config.namespace=${NACOS_NAMESPACE} \
              -Dserver.port=8080 \
              -jar app.jar
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          env:
            - name: APP_NAME
              value: springboot-deployment
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TZ
              value: Asia/Shanghai
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
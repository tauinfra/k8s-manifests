apiVersion: v1
kind: ConfigMap
metadata:
  name: thanos-receive
  namespace: thanos
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
data:
  hashrings.json: |
    [
      {
        "endpoints": [
          {"address": "thanos-receive-0.thanos-receive-headless:10901", "capnproto_address": "thanos-receive-0.thanos-receive-headless:19391"},
          {"address": "thanos-receive-1.thanos-receive-headless:10901", "capnproto_address": "thanos-receive-1.thanos-receive-headless:19391"},
          {"address": "thanos-receive-2.thanos-receive-headless:10901", "capnproto_address": "thanos-receive-2.thanos-receive-headless:19391"}
        ]
      }
    ]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-receive
  namespace: thanos
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive
  namespace: thanos
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive-distributor
spec:
  type: ClusterIP
  ports:
    - port: 10902
      targetPort: http
      protocol: TCP
      name: http
    - port: 10901
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 19291
      targetPort: remote-write
      protocol: TCP
      name: remote
    - port: 19391
      targetPort: capnproto
      protocol: TCP
      name: capnproto
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive-distributor
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-receive-headless
  namespace: thanos
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 10902
      targetPort: http
      protocol: TCP
      name: http
    - port: 10901
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: 19291
      targetPort: remote-write
      protocol: TCP
      name: remote
    - port: 19391
      targetPort: capnproto
      protocol: TCP
      name: capnproto
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
---
apiVersion: v1
kind: Service
metadata:
    prometheus.io/path: /metrics
    prometheus.io/port: '10902'
    prometheus.io/scrape: 'true'
  name: thanos-receive-metcris
  namespace: thanos
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
spec:
  type: ClusterIP
  ports:
    - port: 10902
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-receive
  namespace: thanos
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: receive
spec:
  replicas: 1
  podManagementPolicy: OrderedReady
  serviceName: thanos-receive-headless
  updateStrategy:
    type: RollingUpdate
  minReadySeconds:
  selector:
    matchLabels:
      app.kubernetes.io/name: thanos
      app.kubernetes.io/component: receive
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thanos
        app.kubernetes.io/component: receive
    spec:
      serviceAccountName: thanos-receive
      automountServiceAccountToken: true
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: thanos
                    app.kubernetes.io/component: receive
                topologyKey: kubernetes.io/hostname
              weight: 1          
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: Always
      containers:
        - name: receive
          image: bitnamilegacy/thanos:0.39.2-debian-12-r2
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seLinuxOptions: {}
            seccompProfile:
              type: RuntimeDefault
          args:
            - receive
            - '--log.level=info'
            - '--log.format=logfmt'
            - '--grpc-address=0.0.0.0:10901'
            - '--http-address=0.0.0.0:10902'
            - '--remote-write.address=0.0.0.0:19291'
            - '--receive.capnproto-address=0.0.0.0:19391'
            - '--tsdb.path=/var/thanos/receive'
            - '--label=replica="$(NAME)"'
            - '--label=receive="true"'
            - '--tsdb.retention=7d'
            - '--objstore.config=$(OBJSTORE_CONFIG)'
            - '--receive.local-endpoint=$(POD_NAME).thanos-receive-headless:10901'
            - '--receive.hashrings-file=/var/lib/thanos-receive/hashrings.json'
            - '--receive.replication-factor=2'
          env:
            - name: NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OBJSTORE_CONFIG
              valueFrom:
                secretKeyRef:
                  key: objstore.yml
                  name: thanos-objstore-secret
          ports:
            - containerPort: 10901
              name: grpc
              protocol: TCP
            - containerPort: 10902
              name: http
              protocol: TCP
            - containerPort: 19291
              name: remote-write
              protocol: TCP
            - containerPort: 19391
              name: capnproto
              protocol: TCP
          livenessProbe:
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 30
            httpGet:
              path: /-/healthy
              port: http
              scheme: HTTP
          readinessProbe:
            failureThreshold: 6
            initialDelaySeconds: 30
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 30
            httpGet:
              path: /-/ready
              port: http
              scheme: HTTP
          resources:
            limits:
              cpu: 8
              memory: 32Gi
            requests:
              cpu: 4
              memory: 16Gi
          volumeMounts:
            - name: hashring-config
              mountPath: /var/lib/thanos-receive
            - name: data
              mountPath: /var/thanos/receive
      volumes:
        - name: hashring-config
          configMap:
            name: thanos-receive
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "500Gi"
        storageClassName: alicloud-disk-essd

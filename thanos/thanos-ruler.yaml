apiVersion: v1
kind: ServiceAccount
metadata:
  name: thanos-ruler
  namespace: thanos
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: ruler
apiVersion: v1
kind: Service
metadata:
  name: thanos-ruler
  namespace: thanos
  labels:
    app.kubernetes.io/name: thanos
    app.kubernetes.io/component: ruler
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: http
      protocol: TCP
      name: http

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone-code
  namespace: tekton-ci
spec:
  workspaces:
    - name: workspace
  params:
    - name: code_repo_url
      type: string
    - name: code_repo_revision
      type: string
  steps:
    - name: clone-code
      image: alpine/git
      workingDir: $(workspaces.workspace.path)/code
      script: |
        sleep 120
        echo "gitlab code_repo_url: $(params.code_repo_url)"
        git clone -b $(params.code_repo_revision) $(params.code_repo_url) .
        git rev-parse HEAD
        git show -s --format='%H %an %ad %s'
---
